<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Skybox Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #111827;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
  <!-- Top Navigation -->
  <header class="h-14 border-b border-gray-800 bg-gray-900/80 backdrop-blur px-6 flex items-center justify-between z-10">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <i data-lucide="box" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white tracking-wide">Roblox Skybox Studio</h1>
        <p class="text-[10px] text-gray-400">Interactive 360° Skybox Previewer & Luau Exporter</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <button id="resetCamBtn" class="px-3 py-1.5 text-xs font-medium text-gray-300 hover:text-white bg-gray-800 hover:bg-gray-700 rounded-md border border-gray-700 transition flex items-center gap-1.5">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Camera
      </button>
      <button id="exportCodeBtn" class="px-3 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-md shadow-md shadow-indigo-600/30 transition flex items-center gap-1.5">
        <i data-lucide="code" class="w-3.5 h-3.5"></i> Export Luau
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="flex-1 flex overflow-hidden">
    <!-- 3D Canvas Viewport -->
    <div class="flex-1 relative bg-black flex items-center justify-center">
      <div id="canvas-container" class="w-full h-full"></div>
      
      <!-- Overlay Instructions -->
      <div class="absolute bottom-4 left-4 bg-gray-900/70 backdrop-blur-md px-3 py-1.5 rounded-lg border border-gray-800 text-xs text-gray-400 flex items-center gap-2 pointer-events-none select-none">
        <i data-lucide="mouse-pointer" class="w-3.5 h-3.5 text-indigo-400"></i>
        <span>Drag to rotate 360° | Scroll to zoom</span>
      </div>

      <!-- Quick Preset Selector -->
      <div class="absolute top-4 left-4 bg-gray-900/80 backdrop-blur-md px-3 py-2 rounded-lg border border-gray-800 flex items-center gap-2">
        <span class="text-xs font-medium text-gray-400">Presets:</span>
        <button onclick="applyPreset('nebula')" class="text-xs px-2 py-1 bg-gray-800 hover:bg-indigo-600 hover:text-white rounded text-gray-300 transition">Nebula</button>
        <button onclick="applyPreset('sunset')" class="text-xs px-2 py-1 bg-gray-800 hover:bg-indigo-600 hover:text-white rounded text-gray-300 transition">Sunset</button>
        <button onclick="applyPreset('daylight')" class="text-xs px-2 py-1 bg-gray-800 hover:bg-indigo-600 hover:text-white rounded text-gray-300 transition">Daylight</button>
      </div>
    </div>

    <!-- Sidebar: 6 Faces Texture Settings -->
    <aside class="w-96 border-l border-gray-800 bg-gray-900/90 backdrop-blur flex flex-col custom-scrollbar overflow-y-auto">
      <div class="p-4 border-b border-gray-800">
        <h2 class="text-sm font-semibold text-white flex items-center gap-2">
          <i data-lucide="layers" class="w-4 h-4 text-indigo-400"></i> Skybox Faces (6-Sided)
        </h2>
        <p class="text-xs text-gray-400 mt-0.5">Upload image files or enter Roblox Asset IDs.</p>
      </div>

      <div class="p-4 space-y-4">
        <!-- Face Item Template Function will populate or manual list -->
        <div id="facesList" class="space-y-3"></div>
      </div>
    </aside>
  </div>

  <!-- Export Modal -->
  <div id="codeModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-gray-900 border border-gray-800 w-full max-w-xl rounded-xl shadow-2xl overflow-hidden flex flex-col">
      <div class="px-5 py-4 border-b border-gray-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="file-code" class="w-5 h-5 text-indigo-400"></i>
          <h3 class="text-sm font-semibold text-white">Roblox Luau Sky Script</h3>
        </div>
        <button id="closeModalBtn" class="text-gray-400 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-5">
        <p class="text-xs text-gray-400 mb-2">Paste this script into a ServerScript inside <code class="text-indigo-300">ServerScriptService</code>:</p>
        <div class="relative">
          <pre id="luauCode" class="bg-gray-950 p-4 rounded-lg text-xs font-mono text-emerald-400 overflow-x-auto border border-gray-800 max-h-60 custom-scrollbar"></pre>
        </div>
      </div>
      <div class="px-5 py-3.5 bg-gray-950/60 border-t border-gray-800 flex justify-end gap-2">
        <button id="copyCodeBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy to Clipboard
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // 6 Skybox Faces definition
    const faces = [
      { id: 'SkyboxFt', name: 'Front (Ft)', threeIndex: 4 },
      { id: 'SkyboxBk', name: 'Back (Bk)', threeIndex: 5 },
      { id: 'SkyboxUp', name: 'Top / Up (Up)', threeIndex: 2 },
      { id: 'SkyboxDn', name: 'Bottom / Down (Dn)', threeIndex: 3 },
      { id: 'SkyboxRt', name: 'Right (Rt)', threeIndex: 0 },
      { id: 'SkyboxLf', name: 'Left (Lf)', threeIndex: 1 }
    ];

    const faceData = {};
    faces.forEach(f => {
      faceData[f.id] = { assetId: '', dataUrl: null };
    });

    // Render Face Controls in Sidebar
    const facesListEl = document.getElementById('facesList');
    faces.forEach(f => {
      const card = document.createElement('div');
      card.className = 'bg-gray-800/60 p-3 rounded-lg border border-gray-700/60 space-y-2';
      card.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-white flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-indigo-500"></span> ${f.name}
          </span>
          <span class="text-[10px] text-gray-400 uppercase font-mono">${f.id}</span>
        </div>
        <div class="flex gap-2">
          <div id="thumb-${f.id}" class="w-12 h-12 bg-gray-950 rounded border border-gray-700 flex items-center justify-center overflow-hidden flex-shrink-0 text-gray-600">
            <i data-lucide="image" class="w-4 h-4"></i>
          </div>
          <div class="flex-1 space-y-1.5">
            <input type="text" id="input-${f.id}" placeholder="rbxassetid:// or URL" class="w-full bg-gray-950 text-xs px-2.5 py-1.5 rounded border border-gray-700 focus:outline-none focus:border-indigo-500 text-gray-200" />
            <div class="flex gap-1.5">
              <label class="cursor-pointer bg-gray-700 hover:bg-gray-600 text-gray-200 text-[11px] px-2 py-1 rounded transition flex items-center gap-1">
                <i data-lucide="upload" class="w-3 h-3"></i> Upload
                <input type="file" accept="image/*" class="hidden" onchange="handleFileUpload(event, '${f.id}')" />
              </label>
            </div>
          </div>
        </div>
      `;
      facesListEl.appendChild(card);
    });

    // Setup Three.js Scene
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.rotateSpeed = -0.3;

    // Materials array for Skybox cube
    const materials = [];
    const colors = [0x1f2937, 0x111827, 0x374151, 0x1f2937, 0x111827, 0x374151];
    for (let i = 0; i < 6; i++) {
      materials.push(new THREE.MeshBasicMaterial({ color: colors[i], side: THREE.BackSide }));
    }

    const skyboxGeo = new THREE.BoxGeometry(100, 100, 100);
    const skyboxMesh = new THREE.Mesh(skyboxGeo, materials);
    scene.add(skyboxMesh);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Update face texture in 3D scene
    function updateFaceTexture(faceId, imageUrl) {
      const faceDef = faces.find(f => f.id === faceId);
      if (!faceDef) return;

      const loader = new THREE.TextureLoader();
      loader.load(imageUrl, (texture) => {
        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;
        materials[faceDef.threeIndex].map = texture;
        materials[faceDef.threeIndex].needsUpdate = true;

        const thumb = document.getElementById(`thumb-${faceId}`);
        thumb.innerHTML = `<img src="${imageUrl}" class="w-full h-full object-cover" />`;
      });
    }

    // File Upload Handler
    window.handleFileUpload = function(event, faceId) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        faceData[faceId].dataUrl = e.target.result;
        updateFaceTexture(faceId, e.target.result);
      };
      reader.readAsDataURL(file);
    };

    // Asset ID Input Listeners
    faces.forEach(f => {
      const input = document.getElementById(`input-${f.id}`);
      input.addEventListener('change', (e) => {
        let val = e.target.value.trim();
        faceData[f.id].assetId = val;
        if (val.startsWith('http')) {
          updateFaceTexture(f.id, val);
        }
      });
    });

    // Camera Reset
    document.getElementById('resetCamBtn').addEventListener('click', () => {
      camera.position.set(0, 0, 0.1);
      controls.reset();
    });

    // Presets
    window.applyPreset = function(type) {
      const presetColors = {
        nebula: [0x150030, 0x050015, 0x3b0764, 0x030712, 0x1e1b4b, 0x2e1065],
        sunset: [0x9a3412, 0x7c2d12, 0xf97316, 0x431407, 0xc2410c, 0xea580c],
        daylight: [0x38bdf8, 0x0ea5e9, 0x7dd3fc, 0x0284c7, 0x60a5fa, 0x0369a1]
      };
      const palette = presetColors[type] || presetColors.nebula;
      materials.forEach((m, idx) => {
        m.map = null;
        m.color.setHex(palette[idx]);
        m.needsUpdate = true;
      });
    };

    // Export Luau Code
    const codeModal = document.getElementById('codeModal');
    const luauCodeEl = document.getElementById('luauCode');

    document.getElementById('exportCodeBtn').addEventListener('click', () => {
      const code = `--!strict
-- Generated with Roblox Skybox Studio
local Lighting = game:GetService("Lighting")

local existingSky = Lighting:FindFirstChildOfClass("Sky")
if existingSky then
    existingSky:Destroy()
end

local sky = Instance.new("Sky")
sky.Name = "CustomSkybox"
sky.SkyboxBk = "${faceData.SkyboxBk.assetId || 'rbxassetid://0'}"
sky.SkyboxDn = "${faceData.SkyboxDn.assetId || 'rbxassetid://0'}"
sky.SkyboxFt = "${faceData.SkyboxFt.assetId || 'rbxassetid://0'}"
sky.SkyboxLf = "${faceData.SkyboxLf.assetId || 'rbxassetid://0'}"
sky.SkyboxRt = "${faceData.SkyboxRt.assetId || 'rbxassetid://0'}"
sky.SkyboxUp = "${faceData.SkyboxUp.assetId || 'rbxassetid://0'}"
sky.CelestialBodiesShown = true
sky.Parent = Lighting

print("[Roblox Skybox Studio] Skybox successfully loaded!")`;

      luauCodeEl.textContent = code;
      codeModal.classList.remove('hidden');
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      codeModal.classList.add('hidden');
    });

    document.getElementById('copyCodeBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(luauCodeEl.textContent).then(() => {
        alert('Luau script copied to clipboard!');
      });
    });
  </script>
</body>
</html>
